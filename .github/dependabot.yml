# Dependabot version updates. Security updates are configured separately in
# the repository settings, and aren't affected by the options below.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # New versions are only proposed once they're at least 14 days old.
    cooldown:
      default-days: 14
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      actions:
        update-types: [minor, patch]
