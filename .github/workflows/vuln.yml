name: Vulnerabilities

on:
  push:
    branches: [main]
  pull_request:
  # New vulnerabilities are published independently of changes to the code,
  # so main is also checked daily.
  schedule:
    - cron: "17 5 * * *"

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # govulncheck checks the standard library of the Go version it runs
      # with, so that's the version in go.mod.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln
