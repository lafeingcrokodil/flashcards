version: "2"
linters:
  default: all
  disable:
    # Requires every field of a struct literal to be set, including optional
    # ones whose zero values are the intended defaults (such as most fields of
    # http.Server), which would add noise without catching mistakes.
    - exhaustruct
    - exhaustruct_v5
    # Deprecated, and replaced by gomodguard_v2, which stays enabled.
    - gomodguard
    # Checking an error inline (if err := f(); err != nil) keeps err scoped to
    # the check, which is the idiomatic style when a call only returns an
    # error.
    - noinlineerr
    # Deprecated, and replaced by wsl_v5, which stays enabled.
    - wsl
  settings:
    depguard:
      rules:
        # Only these packages may be imported, so that a new dependency fails
        # the linter until it's added here deliberately.
        main:
          allow:
            - $gostd
            - github.com/lafeingcrokodil/flashcards/v3
            - github.com/stretchr/testify
  exclusions:
    rules:
      # Table-driven tests grow with each case and repeat paths and names in
      # them, which read more easily as literals. Splitting a test up to stay
      # within a length limit doesn't make it easier to follow.
      - path: _test\.go
        linters:
          - funlen
          - goconst
formatters:
  enable:
    - gofmt
    - goimports
